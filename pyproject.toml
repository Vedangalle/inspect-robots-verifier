[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "inspect-robots-verifier"
version = "0.1.0"
description = "Auditable, process-aware visual verification for Inspect Robots trajectories"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Inspect Robots Verifier contributors" }]
dependencies = [
  "inspect-robots>=0.4",
  "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11",
  "numpy<2.5",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.entry-points."inspect_robots.scorers"]
process_vlm = "inspect_robots_verifier.scorer:process_vlm_scorer"

[project.scripts]
inspect-robots-verifier-benchmark = "inspect_robots_verifier.benchmark:main"

[tool.uv.sources]
inspect-robots = { path = "../../work/robocurve/inspect-robots", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/inspect_robots_verifier"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF", "D1"]
ignore = ["D105", "D107"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D1"]
"examples/**" = ["D1"]

[tool.ruff.lint.isort]
known-first-party = ["inspect_robots", "inspect_robots_verifier"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests", "examples"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
branch = true
source = ["inspect_robots_verifier"]

[tool.coverage.report]
fail_under = 95
show_missing = true
exclude_also = [
  "if TYPE_CHECKING:",
  "@(abc\\.)?abstractmethod",
  "^\\s*\\.\\.\\.$",
  ": \\.\\.\\.$",
  "if __name__ == .__main__.:",
]
